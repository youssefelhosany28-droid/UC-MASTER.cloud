name: Build UC MASTER APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web files
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir www
          cp app.js index.html style.css sw.js manifest.json www/
          sed -i "s#__API_URL__#$API_URL#" www/app.js
          sed -i 's#"webDir": "."#"webDir": "www"#' capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: AdMob app id
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build release
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          U=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $U aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --out UC-MASTER.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UC-MASTER-APK
          path: UC-MASTER.apk
          if-no-files-found: error
